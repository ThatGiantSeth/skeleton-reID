name: Publish documentation to Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'   # adjust if your docs live elsewhere

jobs:
  publish-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: build/generate docs here into "Documentation" directory
      # - name: Generate docs
      #   run: |
      #     your-doc-command-here

      - name: Upload documentation to Wiki
        uses: SwiftDocOrg/github-wiki-publish-action@v1
        with:
          path: "docs"   # directory containing markdown to publish
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.WIKI_PUBLISH }}

